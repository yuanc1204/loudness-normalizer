plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.yc.loudnorm'
    compileSdk 34

    defaultConfig {
        applicationId "com.yc.loudnorm.media"
        minSdk 29
        targetSdk 34
        versionCode 53
        versionName "2.12.6"
        ndk {
            // 只保留手机常见架构，控制 APK 体积
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ffmpeg-kit 官方已停止维护，此为 Maven Central 上的社区镜像（包名改为 com.antonkarpenko.ffmpegkit）
    implementation 'com.antonkarpenko:ffmpeg-kit-min:2.1.0'
    // 画面拼接交给系统 MediaCodec + OpenGL，避免 FFmpeg 在 CPU 上逐帧缩放。
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
